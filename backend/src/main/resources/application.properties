spring.application.name=backend

# Defaults match docker-compose.yml(postgres on host port 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/aiproject}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.ai.openai.api-key=${OPEN_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.embedding.model=text-embedding-3-small

# Github Oauth2
spring.security.Oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23li4Qdb3G5BFRjoMR}
spring.security.Oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:f8335a6649fd1332fcae9040d8e241481f19acb6}
spring.security.Oauth2.client.registration.github.scope=read:user,repo
spring.security.Oauth2.client.provider.github.user-name-attribute=id

#Pgvector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=CONSINE_DISTANCE

server.servlet.session.cookie.name=AIPROJECT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.token-encrypter-password=${TOKEN_ENCRYPTER_PASSWORD:aiproject-local-encrypt-key-change-me}
app.token-encrypter-salt=${TOKEN-ENCRYPTER-SALT:deadbeefcafebabe}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50
